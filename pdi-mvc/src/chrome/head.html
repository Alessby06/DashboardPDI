<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sistema PDI: Asociación Cultural Johannes Gutenberg (MVC)</title>
  <link rel="icon" type="image/png" href="./assets/jg-icon.png">
  <link rel="apple-touch-icon" href="./assets/jg-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!--
    Solo Nunito Sans, y sin cursiva.

    Antes se pedian dos familias: Google Sans Flex (opsz,wght@6..144,300..900) y
    Nunito Sans con cursiva. De las 89 KB de Google Sans Flex no se dibujaba ni
    una letra: estaba solo como segunda opcion de la pila --ui-font, detras de
    'Nunito Sans', que siempre esta disponible. El navegador la descargaba igual
    en las diez paginas, 89 KB por pagina, para no usarla nunca. Sigue estando en
    la pila por si alguien la tiene instalada en su sistema, que es lo que
    serves un respaldo: si Nunito Sans fallara, el siguiente salto es
    -apple-system / Segoe UI / Roboto / sans-serif.

    La cursiva tambien se pidio y no se usa: no hay ni un font-style: italic en
    las hojas de estilo. El eje optico (opsz) tampoco hace falta aqui, asi que
    se pide solo el de grosor, del 300 al 900, y el navegador descarga un solo
    archivo con los caracteres que hay en pantalla.
  -->
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300..900&display=swap"
    rel="stylesheet">

  <script>
    (function () {
      var saved = localStorage.getItem("pdi_theme") || "light";
      if (saved === "system") {
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", prefersDark ? "dark" : "light");
      } else {
        document.documentElement.setAttribute("data-theme", saved);
      }
    })();
  </script>

  <!-- Modular CSS Architecture (Carga Directa para Máxima Velocidad sin Fails de Import) -->
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
<!--CSS_PAGINA-->
</head>
