<!-- F2 corrected: Clean neck, zero loose hair behind, hair smoothly gathered into twin braids/pigtails -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="240" height="260">
  <defs>
    <!-- Scoped Card Clip for F2 -->
    <clipPath id="f2-card-clip">
      <rect x="0" y="0" width="240" height="260" />
    </clipPath>
    <!-- Scoped Soft Drop Shadow for F2 -->
    <filter id="f2-soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.12" />
    </filter>
    <filter id="f2-braid-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.22" />
    </filter>
    <!-- Matte Iris Gradient -->
    <linearGradient id="f2-iris-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#140B07" />
      <stop offset="65%" stop-color="#23140D" />
      <stop offset="100%" stop-color="#351F14" />
    </linearGradient>
  </defs>

  <g clip-path="url(#f2-card-clip)">
    <!-- Card Background (Soft Sky Tint) -->
    <rect x="0" y="0" width="240" height="260" fill="#E2F1FB" />
    <circle cx="120" cy="132" r="86" fill="#C5E3F7" />

    <!-- Back Cranial Hair: ONLY the rounded skull base above the nape. ZERO loose hair behind neck! -->
    <path d="M 68 116 
             C 66 70 86 46 120 44 
             C 154 46 174 70 172 116 
             C 172 134 166 146 156 148 
             C 146 150 134 146 120 146 
             C 106 146 94 150 84 148 
             C 74 146 68 134 68 116 Z" fill="#201109" />

    <!-- Body / Petrol Blue Uniform Sweater -->
    <g id="sweater-f2">
      <path d="M 42 260 C 44 212 75 194 104 190 L 136 190 C 165 194 196 212 198 260 Z" fill="#1C4E72" />
      <path d="M 50 260 C 53 220 78 202 104 196" stroke="#256594" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.6" />
      <path d="M 190 260 C 187 220 162 202 136 196" stroke="#256594" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.6" />
    </g>

    <!-- Clean, Unobstructed Neck (Completely visible on both sides, no loose hair!) -->
    <path d="M 107 150 L 107 195 C 107 202 133 202 133 195 L 133 150 Z" fill="#B9784B" />
    <path d="M 107 163 C 114 175 126 175 133 163 C 133 173 107 173 107 163 Z" fill="#9F6238" />

    <!-- Peter Pan Collar -->
    <g id="collar-f2" filter="url(#f2-soft-shadow)">
      <path d="M 120 194 C 116 190 95 190 89 203 C 85 212 95 222 108 220 C 119 218 121 202 120 194 Z" fill="#FFFFFF" />
      <path d="M 108 220 C 98 221 90 213 93 205" stroke="#E2E8F0" stroke-width="1.2" stroke-linecap="round" fill="none" />
      <path d="M 120 194 C 124 190 145 190 151 203 C 155 212 145 222 132 220 C 121 218 119 202 120 194 Z" fill="#FFFFFF" />
      <path d="M 132 220 C 142 221 150 213 147 205" stroke="#E2E8F0" stroke-width="1.2" stroke-linecap="round" fill="none" />
      <circle cx="120" cy="198" r="2.2" fill="#F59E0B" />
      <circle cx="119.5" cy="197.5" r="0.8" fill="#FEF3C7" />
    </g>

    <!-- Head & Ears -->
    <g id="head-f2">
      <!-- Left Ear with Gold Hoop -->
      <ellipse cx="76" cy="138" rx="6.5" ry="9.5" fill="#B9784B" />
      <path d="M 77 134 C 75 137 75 141 78 142" stroke="#9A6038" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <circle cx="73.5" cy="144" r="2.4" fill="#F59E0B" />
      <circle cx="73" cy="143.4" r="0.9" fill="#FEF3C7" />

      <!-- Right Ear with Gold Hoop -->
      <ellipse cx="164" cy="138" rx="6.5" ry="9.5" fill="#B9784B" />
      <path d="M 163 134 C 165 137 165 141 162 142" stroke="#9A6038" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <circle cx="166.5" cy="144" r="2.4" fill="#F59E0B" />
      <circle cx="166" cy="143.4" r="0.9" fill="#FEF3C7" />

      <!-- Face Base Shape -->
      <path d="M 80 120 C 80 82 160 82 160 120 C 160 152 148 174 120 174 C 92 174 80 152 80 120 Z" fill="#C98859" />
      <path d="M 84 96 C 102 90 138 90 156 96 C 146 93 114 92 84 96 Z" fill="#955A32" opacity="0.25" />

      <!-- Eyebrows -->
      <path d="M 94 121 C 99 118 107 119 110 122" stroke="#24150F" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <path d="M 146 121 C 141 118 133 119 130 122" stroke="#24150F" stroke-width="2.5" stroke-linecap="round" fill="none" />

      <!-- Eyes (Matte Depth without specular shine) -->
      <ellipse cx="102" cy="134" rx="4.8" ry="5.8" fill="url(#f2-iris-grad)" />
      <path d="M 96 131 C 98 128 106 128 108 131" stroke="#1F120B" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <path d="M 99 139 C 102 140 105 140 106 139" stroke="#351F14" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.45" />

      <ellipse cx="138" cy="134" rx="4.8" ry="5.8" fill="url(#f2-iris-grad)" />
      <path d="M 132 131 C 134 128 142 128 144 131" stroke="#1F120B" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <path d="M 134 139 C 136 140 139 140 141 139" stroke="#351F14" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.45" />

      <!-- Nose -->
      <path d="M 119 143 C 120 146 123 146 124 144" stroke="#A1633A" stroke-width="1.8" stroke-linecap="round" fill="none" />

      <!-- Radiant Friendly Smile -->
      <path d="M 112 154 C 116 160 124 160 128 154" stroke="#682A1B" stroke-width="2.2" stroke-linecap="round" fill="none" />
    </g>

    <!-- FRONT HAIR & TWIN SCHOOL BRAIDS -->
    <g id="hair-twin-braids">
      <!-- Scalp Crown (Hair smoothly gathered to each side) -->
      <path d="M 72 108 
               C 70 64 96 46 120 46 
               C 144 46 170 64 168 108 
               C 164 84 146 64 120 64 
               C 94 64 76 84 72 108 Z" fill="#2A160E" />

      <!-- Soft Natural Bangs Framing Brow -->
      <path d="M 120 64 C 112 70 102 78 92 84 C 100 80 110 76 120 70 Z" fill="#361D13" />
      <path d="M 120 64 C 128 70 138 78 148 84 C 140 80 130 76 120 70 Z" fill="#361D13" />

      <!-- Side Hair Mass Sweeping Cleanly into Braid Origins Behind/Below Ears -->
      <path d="M 72 106 C 70 118 70 132 74 144 C 78 142 82 136 82 128 C 82 116 78 108 72 106 Z" fill="#24130A" />
      <path d="M 168 106 C 170 118 170 132 166 144 C 162 142 158 136 158 128 C 158 116 162 108 168 106 Z" fill="#24130A" />

      <!-- Delicate Face-Framing Wisps in Front of Ears -->
      <path d="M 76 114 C 74 124 74 136 77 146 C 78 148 80 146 79 140 C 77 132 77 122 78 116 Z" fill="#361D13" />
      <path d="M 164 114 C 166 124 166 136 163 146 C 162 148 160 146 161 140 C 163 132 163 122 162 116 Z" fill="#361D13" />

      <!-- LEFT 3-STRAND BRAID (Draping cleanly forward over Left Shoulder) -->
      <g id="left-braid" filter="url(#f2-braid-shadow)">
        <!-- Top Gathering Tie at Ear Lobe -->
        <ellipse cx="72" cy="144" rx="6.5" ry="3.5" fill="#0284C7" transform="rotate(15, 72, 144)" />
        <ellipse cx="72" cy="143.5" rx="5" ry="2" fill="#38BDF8" transform="rotate(15, 72, 144)" />

        <!-- Segment 1 -->
        <path d="M 68 146 C 62 156 64 166 72 170 C 78 164 78 154 74 146 Z" fill="#24130A" />
        <path d="M 72 170 C 78 164 84 160 82 152 C 80 146 72 144 70 152 Z" fill="#361D13" />

        <!-- Segment 2 -->
        <path d="M 66 166 C 60 176 62 186 70 190 C 76 184 76 174 72 166 Z" fill="#24130A" />
        <path d="M 70 190 C 76 184 82 180 80 172 C 78 166 70 164 68 172 Z" fill="#361D13" />

        <!-- Segment 3 -->
        <path d="M 64 186 C 58 196 60 204 68 208 C 74 202 74 194 70 186 Z" fill="#24130A" />
        <path d="M 68 208 C 74 202 78 198 76 190 C 74 186 68 184 66 190 Z" fill="#361D13" />

        <!-- Sky Blue Ribbon Bow Tie at Braid End -->
        <g id="left-tie">
          <ellipse cx="66" cy="208" rx="4.5" ry="3" fill="#0284C7" />
          <path d="M 62 210 C 58 214 56 220 58 224" stroke="#38BDF8" stroke-width="1.4" stroke-linecap="round" fill="none" />
          <path d="M 70 210 C 74 214 76 220 74 224" stroke="#38BDF8" stroke-width="1.4" stroke-linecap="round" fill="none" />
        </g>
        <!-- Tapered Braid Tail Tuft -->
        <path d="M 66 210 C 64 216 63 224 64 228 C 67 226 68 220 68 212 Z" fill="#24130A" />
      </g>

      <!-- RIGHT 3-STRAND BRAID (Draping cleanly forward over Right Shoulder) -->
      <g id="right-braid" filter="url(#f2-braid-shadow)">
        <!-- Top Gathering Tie at Ear Lobe -->
        <ellipse cx="168" cy="144" rx="6.5" ry="3.5" fill="#0284C7" transform="rotate(-15, 168, 144)" />
        <ellipse cx="168" cy="143.5" rx="5" ry="2" fill="#38BDF8" transform="rotate(-15, 168, 144)" />

        <!-- Segment 1 -->
        <path d="M 172 146 C 178 156 176 166 168 170 C 162 164 162 154 166 146 Z" fill="#24130A" />
        <path d="M 168 170 C 162 164 156 160 158 152 C 160 146 168 144 170 152 Z" fill="#361D13" />

        <!-- Segment 2 -->
        <path d="M 174 166 C 180 176 178 186 170 190 C 164 184 164 174 168 166 Z" fill="#24130A" />
        <path d="M 170 190 C 164 184 158 180 160 172 C 162 166 170 164 172 172 Z" fill="#361D13" />

        <!-- Segment 3 -->
        <path d="M 176 186 C 182 196 180 204 172 208 C 166 202 166 194 170 186 Z" fill="#24130A" />
        <path d="M 172 208 C 166 202 162 198 164 190 C 166 186 172 184 174 190 Z" fill="#361D13" />

        <!-- Sky Blue Ribbon Bow Tie at Braid End -->
        <g id="right-tie">
          <ellipse cx="174" cy="208" rx="4.5" ry="3" fill="#0284C7" />
          <path d="M 170 210 C 166 214 164 220 166 224" stroke="#38BDF8" stroke-width="1.4" stroke-linecap="round" fill="none" />
          <path d="M 178 210 C 182 214 184 220 182 224" stroke="#38BDF8" stroke-width="1.4" stroke-linecap="round" fill="none" />
        </g>
        <!-- Tapered Braid Tail Tuft -->
        <path d="M 174 210 C 176 216 177 224 176 228 C 173 226 172 220 172 212 Z" fill="#24130A" />
      </g>

      <!-- Crown Sheen Arc -->
      <path d="M 96 60 C 108 54 132 54 144 60" stroke="#4E2D1D" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.65" />
    </g>

  </g>
</svg>